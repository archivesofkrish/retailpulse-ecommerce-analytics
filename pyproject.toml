[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse"
version = "1.5.0"
description = "Reproducible e-commerce analytics, data lineage, and evidence-based decision intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "RetailPulse Project"}]
dependencies = [
  "pandas>=2.2,<3.0", "numpy>=1.26,<3.0", "openpyxl>=3.1,<4.0",
  "matplotlib>=3.8,<4.0", "plotly>=5.20,<7.0", "streamlit>=1.49,<2.0",
  "scikit-learn>=1.4,<2.0", "duckdb>=1.0,<2.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "build>=1.2,<2.0",
]
