name: Dependency audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "45 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependencies:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependency audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
      - name: Audit the declared project dependency graph
        run: pip-audit --requirement requirements.txt --progress-spinner off --strict
