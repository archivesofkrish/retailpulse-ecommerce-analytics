name: RetailPulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q dashboard scripts src tests
      - name: Run tests with deprecation warnings as errors
        run: python -W error::DeprecationWarning -m pytest --strict-config --strict-markers -q
      - name: Build source and wheel distributions
        if: matrix.python-version == '3.12'
        run: python -m build
      - name: Verify dependency consistency
        run: python -m pip check
