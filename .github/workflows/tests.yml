name: RetailPulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q dashboard scripts src tests
      - name: Run tests with deprecation warnings as errors
        run: python -W error::DeprecationWarning -m pytest --strict-config --strict-markers -q
      - name: Build source and wheel distributions
        if: matrix.python-version == '3.12'
        run: python -m build
      - name: Verify dependency consistency
        run: python -m pip check

  container-smoke:
    name: Docker build and dashboard health smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --pull -t retailpulse:ci .
      - name: Start dashboard container
        run: docker run --detach --name retailpulse-ci -p 8501:8501 retailpulse:ci
      - name: Wait for Streamlit health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              echo "RetailPulse dashboard health endpoint is ready."
              exit 0
            fi
            sleep 2
          done
          docker logs retailpulse-ci
          exit 1
      - name: Show dashboard logs on failure
        if: failure()
        run: docker logs retailpulse-ci
      - name: Remove dashboard container
        if: always()
        run: docker rm -f retailpulse-ci || true
